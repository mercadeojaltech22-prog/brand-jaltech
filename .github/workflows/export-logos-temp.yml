name: Export Brand Hub Logos
on:
  push:
    branches:
      - drive-logo-export-2026-11-26
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare logo packages
        run: |
          mkdir -p export/jaltech export/jaltech-pos export/partner-pos export/basik-tech export/gamer-tech export/tecnigo
          find assets/logo -maxdepth 1 -type f \( -name '*.png' -o -name '*.svg' \) ! -name 'favicon-jaltech.png' -exec cp {} export/jaltech/ \;
          cp assets/lineas-negocio/jaltech-pos/* export/jaltech-pos/
          cp assets/lineas-negocio/partners-pos/* export/partner-pos/
          cp assets/lineas-negocio/basik-tech/* export/basik-tech/
          cp assets/lineas-negocio/gamer-tech/* export/gamer-tech/
          cp assets/lineas-negocio/tecnigo/* export/tecnigo/
      - uses: actions/upload-artifact@v4
        with:
          name: jaltech
          path: export/jaltech/
      - uses: actions/upload-artifact@v4
        with:
          name: jaltech-pos
          path: export/jaltech-pos/
      - uses: actions/upload-artifact@v4
        with:
          name: partner-pos
          path: export/partner-pos/
      - uses: actions/upload-artifact@v4
        with:
          name: basik-tech
          path: export/basik-tech/
      - uses: actions/upload-artifact@v4
        with:
          name: gamer-tech
          path: export/gamer-tech/
      - uses: actions/upload-artifact@v4
        with:
          name: tecnigo
          path: export/tecnigo/
